# Levanta PostgreSQL y Redis locales. Los volúmenes con nombre garantizan
# que los datos sobrevivan a reinicios/apagados del computador.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tickets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      # 5432 del host lo ocupan los servicios nativos de PostgreSQL de Windows
      # (postgresql-x64-14/18), así que el contenedor se publica en 5434.
      - "5434:5432"
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tickets_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tickets_redisdata:/data

volumes:
  tickets_pgdata:
  tickets_redisdata:
